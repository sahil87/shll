agent: null
checklist:
    extra_categories: []
fab_version: 2.14.0
project:
    description: Meta-CLI for the sahil87 toolkit — update, shell-init, and version across all sahil87 tools.
    name: shll
providers:
    claude:
        session_command: claude --dangerously-skip-permissions --effort xhigh -n "$(basename "$(pwd)")"
